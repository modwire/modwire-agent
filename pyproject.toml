[project]
name = "modwire-agent"
version = "0.1.0"
description = "Modwire agent runtime and MCP adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "copier>=9.16.0",
    "dj-database-url",
    "django",
    "django-health-check",
    "django-model-utils",
    "django-ninja-extra",
    "gunicorn",
    "mermaid-cli>=0.1.3",
    "modwire-architecture>=6.0.0,<7",
    "modwire-mermaid>=1.0.1,<2",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-yaml>=1.7.0",
    "pygments",
    "python-dotenv",
    "pyyaml",
    "structlog",
    "wireup",
]

[dependency-groups]
dev = [
    { include-group = "mcp-adapter" },
    "openapi-python-client",
    "pytest",
    "pytest-django",
    "ruff",
]
mcp-adapter = [
    "httpx>=0.28",
    "mcp>=1.28.1",
]

[tool.uv]
package = false
cache-dir = ".dev/uv-cache"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "modwire.core.settings"
cache_dir = ".dev/pytest-cache"
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
cache-dir = ".dev/ruff-cache"
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
"src/modwire/core/settings.py" = ["E402"]

[tool.coverage.run]
data_file = ".dev/coverage"

[tool.mypy]
cache_dir = ".dev/mypy-cache"

boundaries:
  tags:
    - { name: technical, match: "*" }
    - { name: module, match: "src/enclosure/*", excluded_patterns: [src/enclosure/core, src/enclosure/__init__.py, src/enclosure/autowiring.py] }
    - { name: module_api, match: "src/enclosure/*/__init__.py" }
    - { name: adapters, match: "src/enclosure/*/adapters" }
    - { name: use_cases, match: "src/enclosure/*/use_cases" }
    - { name: ports, match: "src/enclosure/*/ports" }
    - { name: domain, match: "src/enclosure/*/domain" }
  flow:
    module_tag: module
    layers: [adapters, use_cases, ports, domain]
    analyzers: [backward-flow, no-cycles, no-reentry]


shape:
  realms:
    - name: project
      match: "src/enclosure/*"
      shape:
      # agent untouchable start
        max_classes_per_file: -1
        max_types_per_file: -1
        max_abstract_classes_per_file: 1
        max_functions_per_file: 0
        allow_optional_function_args: false
        allow_optional_method_args: false
        allow_optional_class_properties: false
        allow_import_aliases: true
        require_joined_imports: true
      # agent untouchable end
    
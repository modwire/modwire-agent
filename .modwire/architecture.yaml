shape:
# agent untouchable start
  max_classes_per_file: 4
  max_types_per_file: 1
  max_abstract_classes_per_file: 1
  max_functions_per_file: 0
  allow_optional_function_args: false
  allow_optional_method_args: false
  allow_optional_class_properties: false
  allow_import_aliases: true
  require_joined_imports: true
# agent untouchable end

boundaries:
  tags:
    - { name: technical, match: "*" }
    - { name: module, match: "src/modwire_agent/*", excluded_patterns: [src/modwire_agent/core, src/modwire_agent/__init__.py, src/modwire_agent/wiring.py] }
    - { name: module_api, match: "src/modwire_agent/*/__init__.py" }
    - { name: adapters, match: "src/modwire_agent/*/adapters" }
    - { name: use_cases, match: "src/modwire_agent/*/use_cases" }
    - { name: ports, match: "src/modwire_agent/*/ports" }
    - { name: domain, match: "src/modwire_agent/*/domain" }
    - { name: wiring, match: "src/modwire_agent/*/wiring.py" }
  flow:
    module_tag: module
    layers: [adapters, use_cases, ports, domain]
    analyzers: [backward-flow, no-cycles, no-reentry]

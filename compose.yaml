name: modwire-mcp

services:
  scaffolding-api:
    image: ghcr.io/modwire/modwire-agent-runtime:${MODWIRE_MCP_VERSION:-latest}
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,scaffolding-api
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the existing PostgreSQL database}
      DEBUG: "0"
      RECORDS_EMBEDDINGS_ENABLED: ${RECORDS_EMBEDDINGS_ENABLED:-1}
      RECORDS_EMBEDDING_PROVIDER: ${RECORDS_EMBEDDING_PROVIDER:-deterministic}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    ports:
      - "127.0.0.1:${SCAFFOLDING_API_PORT:-8100}:8000"
    networks:
      - records
      - services
    restart: unless-stopped

  mcp-adapter:
    depends_on:
      scaffolding-api:
        condition: service_healthy
    environment:
      MCP_ADAPTER_HOST: 0.0.0.0
      MCP_ADAPTER_PORT: "8200"
      MCP_ADAPTER_VERSION: ${MODWIRE_MCP_VERSION:-latest}
      SCAFFOLDING_API_KEY_FILE: /run/secrets/scaffolding-api-key
      SCAFFOLDING_API_URL: http://scaffolding-api:8000/api/
    image: ghcr.io/modwire/modwire-agent-adapter:${MODWIRE_MCP_VERSION:-latest}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8200/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "127.0.0.1:${MCP_ADAPTER_PORT:-8200}:8200"
    networks:
      - services
      - edge
    secrets:
      - source: scaffolding-api-key
        target: scaffolding-api-key
    restart: unless-stopped

secrets:
  scaffolding-api-key:
    file: ${MCP_ADAPTER_API_KEY_FILE:-.dev/secrets/mcp-adapter-api-key}

networks:
  records:
    external: true
    name: modwire-records_default
  services:
    internal: true
  edge: {}
